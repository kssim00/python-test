lay:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.editor-head .ttl{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}.editor-head .tag{font-size:12.5px;font-weight:700;color:var(--accent);background:rgba(124,140,255,.12);padding:3px 9px;border-radius:99px}.editor-head .btns{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}button.run,button.grade,button.reset,button.send{border:none;border-radius:9px;padding:8px 15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s}button:hover{filter:brightness(1.12)}button.run{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}button.grade{background:var(--mint);color:#06281a}button.reset{background:transparent;color:var(--ink-dim);border:1px solid var(--line)}.code-editor-wrap{position:relative}textarea.code{position:relative;z-index:2;width:100%;min-height:420px;resize:vertical;background:transparent;color:transparent;caret-color:#c8d3f5;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-family:var(--mono);font-size:15.5px;line-height:1.7;outline:none;tab-size:4;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word}textarea.code:focus{border-color:var(--accent)}pre.code-hi{position:absolute;top:0;left:0;right:0;bottom:0;margin:0;padding:13px 15px;font-family:var(--mono);font-size:15.5px;line-height:1.7;tab-size:4;white-space:pre-wrap;overflow-wrap:break-word;overflow:hidden;pointer-events:none;border:1px solid transparent;border-radius:10px;box-sizing:border-box;color:#c8d3f5;background:var(--code-bg)}pre.code-hi code{font:inherit;white-space:inherit;color:inherit}.tk-kw{color:#6ab0f3;font-weight:600}.tk-const{color:#6ab0f3;font-weight:600}.tk-str{color:#e0af68}.tk-com{color:#7aa876;font-style:italic}.tk-num{color:#8fd9b6}.tk-fn{color:#dcdcaa}.tk-call{color:#7ee1e8}.tk-blank{background:rgba(255,199,107,.25);color:var(--amber);border-radius:3px;padding:0 2px}.stdin-label{font-size:13.5px;color:var(--ink-dim);font-weight:700;letter-spacing:.06em;margin:10px 0 5px}textarea.stdin{width:100%;min-height:44px;resize:vertical;background:var(--code-bg);color:#a8f0cf;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-family:var(--mono);font-size:15px;line-height:1.6;outline:none}textarea.stdin:focus{border-color:var(--mint)}.console{background:#050810;border:1px solid var(--line);border-radius:10px;margin-top:10px;padding:11px 14px;min-height:58px;max-height:210px;overflow-y:auto;font-family:var(--mono);font-size:15px;line-height:1.7;white-space:pre-wrap}.console .label{font-size:12.5px;color:var(--ink-dim);letter-spacing:.1em;margin-bottom:5px}.console .ok{color:#a8f0cf}.console .err{color:var(--red)}.console .idle{color:#4a5578}.test-results{display:flex;flex-direction:column;gap:7px;margin-top:4px}.tcase{border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14.5px;background:var(--panel2)}.tcase.pass{border-color:rgba(61,220,151,.5)}.tcase.fail{border-color:rgba(255,123,138,.5)}.tcase .thead{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:4px}.tcase.pass .thead{color:var(--mint)}.tcase.fail .thead{color:var(--red)}.tcase .tdetail{font-family:var(--mono);font-size:14px;color:var(--ink-dim);white-space:pre-wrap;line-height:1.6}.grade-banner{border-radius:10px;padding:11px 14px;font-size:15.5px;font-weight:700;margin-bottom:8px;display:none}.grade-banner.good{display:block;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.45);color:var(--mint)}.grade-banner.bad{display:block;background:rgba(255,123,138,.1);border:1px solid rgba(255,123,138,.4);color:var(--red)}aside.chat{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.chat-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.chat-head .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent-d ton.send{background:var(--accent-deep);color:#fff}@media (max-width:1080px){.layout{grid-template-columns:1fr;overflow-y:auto}.qpane{border-right:none;border-bottom:1px solid var(--line)}aside.chat{max-height:50vh;border-left:none;border-top:1px solid var(--line)}#approot{overflow:auto;height:auto;min-height:100vh}.resize-handle{display:none}}
</style>

<body>
<div id="approot">
<header><span class="logo">🐍</span><h1>COS Pro 기출 문제 풀이<small>AI 과외 선생님과 함께하는 파이썬 시험 대비 · <b style="color:var(--mint)">v42</b></small></h1><div class="progress-wrap"><span class="progress-label" id="progressLabel">0 / 0 완료</span><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div></header><div class="layout"><!-- 왼쪽: 문제 지문 --><nav class="qpane"><div class="level-tabs"><button class="level-btn active" id="lv3" onclick="setLevel('3')">🥉 3급</button><button class="level-btn" id="lv2" onclick="setLevel('2')">🥈 2급</button><button class="level-btn" id="lv1" onclick="setLevel('1')">🥇 1급</button></div><div class="set-row"><select class="set-sel" id="setSel"></select><span class="set-type" id="setType"></span></div><div class="num-grid" id="numGrid"></div><div class="qcard"><span class="qtag" id="qTag"></span><h2 id="qTitle"></h2><div class="qdesc" id="qDesc"></div><div class="qimg" id="qImg" style="display:none"></div><div class="ex-title">📋 입출력 예시</div><div id="qEx"></div><div class="actions-row"><button class="ghost" id="btnHint" style="display:none">💡 힌트 보기</button><button class="ghost" id="btnSol">🔒 정답 코드 보기</button></div><div class="solbox" id="solBox"></div></div></nav><div class="resize-handle" id="resizeHandle" title="드래그해서 폭 조절"></div><!-- 가운데: 코드 작성 --><main><section class="card"><div class="editor-head"><span class="ttl"><span class="tag">코드 작성</span><span id="edTitle"></span></span><div class="btns"><button class="reset" id="btnReset">초기화</button><button class="run" id="btnRun">▶ 실행</button><button class="grade" id="btnGrade">✓ 채점하기</button></div></div><div class="code-editor-wrap"><textarea class="code" id="codeArea" spellcheck="false"></textarea><pre class="code-hi" id="codeHi" aria-hidden="true"><code></code></pre></div><div class="stdin-label">⌨️ 표준 입력 (input 값 — 여러 줄 입력 가능)</div><textarea class="stdin" id="stdinArea" spellcheck="false"></textarea><div class="console"><div class="label">실행 결과</div><div id="consoleOut"><span class="idle">▶ 실행 또는 ✓ 채점하기를 눌러 보세요.</span></div></div></section><section class="card"><div class="editor-head"><span class="ttl"><span class="tag">채점 결과</span></span></div><div class="grade-banner" id="gradeBanner"></div><div class="test-results" id="testResults"><span style="font-size:15px;color:var(--ink-dim)">채점하기를 누르면 모든 테스트 케이스 결과가 표시됩니다.</span></div></section></main><!-- 오른쪽: AI 선생님 --><aside class="chat"><div class="chat-head"><div class="avatar">🎓</div><div><div class="name">AI 선생님</div><div class="status">● 온라인 — 시험 대비 모드</div></div></div><div class="chat-body" id="chatBody"><div class="bubble ai">안녕하세요! COS Pro 시험 대비를 함께할 AI 선생님이에요. 💪
문제가 막히면 정답 대신 힌트로 이끌어 드릴게요. 왼쪽에서 문제를 고르고, 궁금한 건 뭐든 물어보세요!</div></div><div class="chat-suggest"><button class="chip" data-q="이 문제를 어떻게 접근해야 할지 힌트만 주세요">💡 힌트 줘</button><button class="chip" data-q="지금 제 코드를 봐주세요. 어디가 잘못됐나요? 정답은 알려주지 말고 어느 부분을 다시 보면 될지만 짚어주세요.">🔍 내 코드 봐줘</button><button class="chip" data-q="이 문제에 쓰이는 파이썬 개념을 쉽게 설명해 주세요">📖 개념 설명</button><button class="chip" data-q="방금 채점 결과에서 틀린 이유를 알려주세요">❌ 왜 틀렸지?</button></div><div class="chat-input"><input id="chatInput" placeholder="질문을 입력하세요..." /><button class="send" id="btnSend">전송</button></div></aside></div>

<script>
/* ============================================================
   COS Pro 문제 데이터 파일
   ------------------------------------------------------------
   새 문제를 추가할 때는 이 파일만 수정하면 됩니다.
   (앱 화면/스타일/채점 로직은 app.js 에 있고 건드릴 필요 없음)

   [SETS] 문제 세트(교재) 목록 — 세트 하나 = 화면의 버튼 하나
     key   : 세트 고유 알파벳 (A, B, C ... 새 세트는 다음 알파벳 사용)
     name  : 화면에 보일 세트 이름
     icon  : 세트 아이콘 이모지
     type  : "직접 작성형" | "빈칸 채우기형" | "함수 완성형" | "혼합형"
     level : "3"(3급) 또는 "2"(2급)

   [PROBLEMS] 문제 목록 — 새 문제는 배열 맨 끝에 { ... } 추가
     set     : 이 문제가 속한 세트 (SETS의 key)
     title   : 문제 제목
     desc    : 문제 설명. 줄바꿈은 \n 으로 표기
     func    : true면 "함수 완성형"(solution 함수 작성) 문제. 없으면 표준 입출력형
     label   : func:true 문제의 보조 표시 (예: "직접 작성", "빈칸 채우기 (@@)")
     ex      : 문제 화면에 보여줄 예시
                 표준입출력형: {"i": 입력, "o": 출력}
                 함수형     : {"i": "solution(...)" 호출 예시, "o": 결과, "note": 설명(선택)}
     starter : 학생에게 보여줄 시작 코드
     sol     : 정답 코드 (모범 답안)
     tests   : 채점용 테스트 케이스
                 표준입출력형: {"i": 입력, "o": 기대 출력}
                 함수형     : {"call": "solution(...)" 호출문, "o": 기대 결과}
   ============================================================ */

const SETS = {
  "A": {
    "name": "COS Pro 3급 기출",
    "icon": "📘",
    "type": "직접 작성형",
    "level": "3"
  },
  "B": {
    "name": "3급 기출 변형",

    "type": "직접 작성형",
    "level": "3"
  },
  "C": {
    "name": "기출변형 빈칸채우기",
    "icon": "📙",
    "type": "빈칸 채우기형",
    "level": "3"
  },
  "D": {
    "name": "파이썬 코딩 문제집",
    "icon": "📕",
    "type": "혼합형",
    "level": "3"
  },
  "E": {
    "name": "2급 모의고사 1차",
    "icon": "📓",
    "type": "함수 완성형",
    "level": "2"
  },
  "F": {
    "name": "2급 모의고사 2차",
    "icon": "📔",
    "type": "함수 완성형",
    "level": "2"
  },
  "G": {
    "name": "2급 모의고사 3차",
    "icon": "📒",
    "type": "함수 완성형",
    "level": "2"
  },
  "H": {
    "name": "2급 모의고사 4차",

    "starter": "#다음과 같이 import를 사용할 수 있습니다.\n#import math\n\ndef solution(arr, N):\n    #여기에 코드를 작성해주세요.\n    answer = 0\n    return answer\n\n# 아래는 테스트케이스 출력을 해보기 위한 코드입니다. 아래에는 잘못된 부분이 없으니 위의 코드만 수정하세요.\narr1 = [[0, 25, 7, 56, 12], [4, 0, 31, 88, 45], [62, 19, 0, 71, 23], [95, 36, 51, 0, 44], [16, 41, 66, 73, 0]]\nN1 = 5\nret1 = solution(arr1, N1)\n# [실행] 버튼을 누르면 출력 값을 볼 수 있습니다.\nprint(\"solution 함수의 반환 값은\", ret1, \"입니다.\")\n\narr2 = [[0, 11, 24, 98, 46], [53, 0, 29, 62, 75], [82, 36, 0, 5, 18], [42, 54, 33, 0, 21], [9, 54, 92, 86, 0]]\nN2 = 5\nret2 = solution(arr2, N2)\n# [실행] 버튼을 누르면 출력 값을 볼 수 있습니다.\nprint(\"solution 함수의 반환 값은\", ret2, \"입니다.\")\n\narr3 = [[0, 18, 34, 22], [48, 0, 55, 61], [18, 7, 0, 15], [71, 86, 94, 0]]\nN3 = 4\nret3 = solution(arr3, N3)\n# [실행] 버튼을 누르면 출력 값을 볼 수 있습니다.\nprint(\"solution 함수의 반환 값은\", ret3, \"입니다.\")\n\n\n",
    "sol": "min_value = 10000\nrooms = []\nvisited = []\nlength = 0\n\n\ndef patrol(now, e_sum):\n    global min_value\n\n    if e_sum < min_value:\n        if 0 not in visited:\n            min_value = min(min_value, e_sum + rooms[now][0])\n            return\n\n        for next_room in range(length):\n            if next_room != now and visited[next_room] == 0:\n                visited[next_room] = 1\n                patrol(next_room, e_sum + rooms[now][next_room])\n                visited[next_room] = 0\n\n\ndef solution(arr, N):\n    global length, rooms, visited, min_value\n    visited = [0] * N\n    visited[0] = 1\n    length = N\n    rooms = arr\n    min_value = 10000\n    patrol(0, 0)\n\n    return min_value",

    "desc": "배달음식 전문점 운영을 위해 다음과 같이 DeliveryStore 인터페이스와  PizzaStore, Food 클래스를 작성했습니다.\n\n{{IMG}}\n\n* DeliveryStore :\n  * DeliveryStore는 배달 음식점의 인터페이스입니다.\n  * 배달 음식점은 set_order_list와 get_total_price 함수를 구현해야 합니다.\n  * set_order_list 함수는 주문 메뉴의 리스트를 매개변수로 받아 저장합니다.\n  * get_total_price 함수는 주문받은 음식 가격의 총합을 return 합니다.\n\n* Food : \n  * Food는 음식을 나타내는 클래스입니다.\n  * 음식은 이름(name)과 가격(price)으로 구성되어있습니다.\n\n* PizzaStore\n  * PizzaStore는 피자 배달 전문점을 나타내는 클래스이며 DeliveryStore 인터페이스를 구현합니다.\n  * menu_list는 피자 배달 전문점에서 주문 할 수 있는 음식의 리스트를 저장합니다.\n  * order_list는 주문 받은 음식들의 이름을 저장합니다.\n  * set_order_list 함수는 주문 메뉴를 받아 order_list에 저장합니다.\n  * get_total_price 함수는 order_list에 들어있는 음식 가격의 총합을 return 합니다.\n\n주문 메뉴가 들어있는 리스트 order_list가 매개변수로 주어질 때, 주문한 메뉴의 전체 가격을 return 하도록 solution 함수를 작성하려고 합니다. 위의 클래스 구조를 참고하여 주어진 코드의 빈칸을 적절히 채워 전체 코드를 완성해주세요.\n\n▶ 매개변수 설명\n주문 메뉴가 들어있는 리스트 order_list가 solution 함수의 매개변수로 주어집니다.\n\n* order_list의 길이는 1 이상 5이하입니댜.\n* order_list에는 주문하려는 메뉴의 이름들이 문자열 형태로 들어있습니다.\n  * order_list에는 같은 메뉴의 이름이 중복해서 들어있지 않습니다.\n* 메뉴의 이름과 가격은 PizzaStore의 생성자에서 초기화해줍니다.\n\n▶ return 값 설명\n주문한 메뉴의 전체 가격을 return 해주세요.",

    "starter": "from abc import *\n \nclass DeliveryStore(metaclass=ABCMeta):\n    @abstractmethod\n    def set_order_list(self, order_list):\n        pass\n    \n    @abstractmethod\n    def get_total_price(self):\n        pass\n    \nclass Food:\n    def __init__(self, name, price):\n        self.name = name\n        self.price = price\n        \nclass PizzaStore@@@:\n    def __init__(self):\n        menu_names = [\"Cheese\", \"Potato\", \"Shrimp\", \"Pineapple\", \"Meatball\"]\n        menu_prices = [11100, 12600, 13300, 21000, 19500];\n        self.menu_list = []\n        for i in range(5):\n            self.menu_list.append(Food(menu_names[i], menu_prices[i]))\n        \n        self.order_list = []\n    \n    def @@@:\n        for order in order_list:\n            self.order_list.append(order)\n\n    def @@@:\n        total_price = 0\n        for order in self.order_list:\n            for menu in self.menu_list:\n                if order == menu.name:\n                    total_price += menu.price\n        return total_price \n            \ndef solution(order_list):\n    delivery_store = PizzaStore()\n    \n    delivery_store.set_order_list(order_list)\n    total_price = delivery_store.get_total_price()\n    return total_price\n\n#The following is code to output testcase.\norder_list = [\"Cheese\", \"Pineapple\", \"Meatball\"]\nret = solution(order_list)\n\n#Press Run button to receive output. \nprint(\"Solution: return value of the function is\", ret, \".\")",
    "sol": "from abc import *\n \n# 배달 음식점이 반드시 구현해야 하는 두 함수(추상 메서드)를 정의하는 인터페이스\nclass DeliveryStore(metaclass=ABCMeta):\n    @abstractmethod\n    def set_order_list(self, order_list):\n        pass\n    \n    @abstractmethod\n    def get_total_price(self):\n        pass\n    \n# 음식 하나의 이름과 가격을 저장하는 클래스\nclass Food:\n    def __init__(self, name, price):\n        self.name = name\n        self.price = price\n        \n# DeliveryStore 인터페이스를 구현하는 피자 배달 전문점 클래스\nclass PizzaStore(DeliveryStore):\n    def __init__(self):\n        menu_names = [\"Cheese\", \"Potato\", \"Shrimp\", \"Pineapple\", \"Meatball\"]\n        menu_prices = [11100, 12600, 13300, 21000, 19500];\n        self.menu_list = []\n        # 메뉴 이름과 가격을 짝지어 Food 객체로 만들어 menu_list에 저장\n        for i in range(5):\n            self.menu_list.append(Food(menu_names[i], menu_prices[i]))\n        \n        self.order_list = []  # 주문받은 메뉴 이름들을 저장할 리스트\n    \n    # 주문받은 메뉴 이름들을 order_list에 순서대로 저장\n    def set_order_list(self, order_list):\n        for order in order_list:\n            self.order_list.append(order)\n\n    # order_list의 각 주문을 menu_list에서 찾아 가격을 모두 더한다\n    def get_total_price(self):\n        total_price = 0\n        for order in self.order_list:\n            for menu in self.menu_list:\n                if order == menu.name:\n                    total_price += menu.price\n        return total_price \n            \n# PizzaStore 객체를 생성해 주문을 넣고 총 주문 금액을 반환받는다\ndef solution(order_list):\n    delivery_store = PizzaStore()\n    \n    delivery_store.set_order_list(order_list)\n    total_price = delivery_store.get_total_price()\n    return total_price",

    "sol": "# (i, j)가 격자 범위 안에 있는지 확인\ndef in_range(i, j, n):\n    return 0 <= i and i < n and 0 <= j and j < n\n\ndef solution(n):\n    pane = [[0 for j in range(n)] for i in range(n)]  # n x n 격자, 처음엔 모두 0\n    dy = [0, 1, 0, -1]  # 이동 방향: 오른쪽 → 아래 → 왼쪽 → 위 (시계 방향)\n    dx = [1, 0, -1, 0]\n    ci, cj = 0, 0  # 현재 숫자를 채워 넣을 위치\n    num = 1  # 채워 넣을 숫자\n    # 더 이상 채울 칸이 없을 때까지 반복\n    while in_range(ci, cj, n) and pane[ci][cj] == 0:\n        for k in range(4):  # 4가지 방향을 순서대로 시도\n            if not in_range(ci, cj, n) or pane[ci][cj] != 0:\n                break\n            # 현재 방향(k)으로 갈 수 있는 만큼 계속 전진하며 숫자를 채운다\n            while True:\n                pane[ci][cj] = num\n                num += 1\n                ni = ci + dy[k]\n                nj = cj + dx[k]\n                # 다음 칸이 격자를 벗어나거나 이미 채워져 있으면 다음 방향으로 전환\n                if not in_range(ni, nj, n) or pane[ni][nj] != 0:\n                    ci += dy[(k + 1) % 4]\n                    cj += dx[(k + 1) % 4]\n                    break\n                ci = ni\n                cj = nj\n\n    # 1행 1열부터 n행 n열까지, 즉 대각선(pane[i][i])에 있는 값들의 합을 구한다\n    ans = 0\n    for i in range(n):\n        ans += pane[i][i]\n    return ans",

    "starter": "class Customer:\n    def __init__(self, id, time, num_of_people):\n        self.id = id\n        self.time = time\n        self.num_of_people = num_of_people\n\nclass Shop:\n    def __init__(self):\n        self.reserve_list = []\n    \n    def reserve(self, customer):\n        self.reserve_list.append(customer)\n        return True\n\nclass HairShop@@@:\n    def __init__(self):\n        super().__init__()\n        \n    @@@:\n        if @@@ != 1:\n            return False\n        for r in self.reserve_list:\n            if @@@:\n                return False\n        self.reserve_list.append(customer)\n        return True\n    \nclass Restaurant@@@:\n    def __init__(self):\n        super().__init__()\n        \n    @@@:\n        if @@@:\n            return False\n        count = 0\n        for r in self.reserve_list:\n            if @@@:\n                count += 1\n        if count >= 2:\n            return False\n        self.reserve_list.append(customer)\n        return True\n    \n\ndef solution(customers, shops):\n    hairshop = HairShop()\n    restaurant = Restaurant()\n    \n    count = 0\n    for customer, shop in zip(customers, shops):\n        if shop == \"hairshop\":\n            if hairshop.reserve(Customer(customer[0], customer[1], customer[2])):\n                count += 1\n        elif shop == \"restaurant\":\n            if restaurant.reserve(Customer(customer[0], customer[1], customer[2])):\n                count += 1\n    \n    return count\n\n#아래는 테스트케이스 출력을 해보기 위한 코드입니다.\ncustomers = [[1000, 2, 1],[2000, 2, 4],[1234, 5, 1],[4321, 2, 1],[1111, 3, 10]]\nshops = [\"hairshop\", \"restaurant\", \"hairshop\", \"hairshop\", \"restaurant\"]\nret = solution(customers, shops)\n\n#[실행] 버튼을 누르면 출력 값을 볼 수 있습니다.\nprint(\"solution 함수의 반환 값은\", ret, \"입니다.\")",
    "sol": "class Customer:\n    def __init__(self, id, time, num_of_people):\n        self.id = id\n        self.time = time\n        self.num_of_people = num_of_people\n\n# 가게의 공통 기능(예약 리스트 보관)을 담당하는 부모 클래스\nclass Shop:\n    def __init__(self):\n        self.reserve_list = []\n    \n    def reserve(self, customer):\n        self.reserve_list.append(customer)\n        return True\n\n# 미용실: 인원이 1명이고, 같은 시간에 예약이 없을 때만 예약 가능\nclass HairShop(Shop):\n    def __init__(self):\n        super().__init__()\n        \n    def reserve(self, customer):\n        if customer.num_of_people != 1:\n            return False\n        for r in self.reserve_list:\n            if r.time == customer.time:  # 같은 시간에 이미 예약한 손님이 있으면 예약 불가\n                return False\n        self.reserve_list.append(customer)\n        return True\n    \n# 레스토랑: 인원이 2~8명이고, 같은 시간대 예약이 이미 2팀이면 예약 불가\nclass Restaurant(Shop):\n    def __init__(self):\n        super().__init__()\n        \n    def reserve(self, customer):\n        if customer.num_of_people < 2 or customer.num_of_people > 8:\n            return False\n        count = 0\n        for r in self.reserve_list:\n            if r.time == customer.time:\n                count += 1\n        if count >= 2:\n            return False\n        self.reserve_list.append(customer)\n        return True\n    \n\ndef solution(customers, shops):\n    hairshop = HairShop()\n    restaurant = Restaurant()\n    \n    count = 0\n    # 고객을 신청 순서대로 하나씩 꺼내, 원하는 가게에 예약을 시도한다\n    for customer, shop in zip(customers, shops):\n        if shop == \"hairshop\":\n            if hairshop.reserve(Customer(customer[0], customer[1], customer[2])):\n                count += 1\n        elif shop == \"restaurant\":\n            if restaurant.reserve(Customer(customer[0], customer[1], customer[2])):\n                count += 1\n    \n    return count",

    "sol": "vowels = ['A', 'E', 'I', 'O', 'U']  # 사전에 사용되는 모음들 (알파벳 순서)\nwords = []  # 사전에 등록된 모든 단어를 저장할 리스트\n\ndef create_words(lev, s):\n    words.append(s)  # 지금까지 만든 문자열 s도 사전에 포함\n    for i in range(0, 5):\n        if lev < 5:\n            create_words(lev + 1, s+vowels[i])  # 다음 깊이로 재귀 호출해야 무한 재귀에 빠지지 않는다 (원래 버그였던 부분)\n\ndef solution(word):\n    answer = 0\n    create_words(0, '')  # 길이 5 이하의 모든 단어를 words에 순서대로(사전 순) 생성\n    words_n = len(words)\n    for i in range(words_n):\n        if word == words[i]:\n            answer = i  # word가 몇 번째(0부터 시작하는 인덱스)에 있는지 찾는다\n            break\n    return answer",

    "starter": "def solution(s):\n    s = s.lower()\n    answer = \"\"\n    previous = s[0]\n    counter = 1\n    for alphabet in s[1:]:\n        if alphabet == previous:\n            counter += 1\n        else:\n            answer += previous + str(counter)\n            counter = 1\n            previous = s[0]\n    answer += previous + str(counter)\n    return answer\n\n# 아래는 테스트케이스 출력을 해보기 위한 코드입니다. 아래에는 잘못된 부분이 없으니, 위의 코드만 수정하세요.\ns = \"YYYYYbbbBbbBBBMmmM\"\nret = solution(s)\n\n# [실행] 버튼을 누르면 출력 값을 볼 수 있습니다.\nprint(\"solution 함수의 반환 값은\", ret, \"입니다.\")",
    "sol": "small_letters = \"abcdefghijklmnopqrstuvwxyz\"\nbig_letters = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n\n# 대문자를 소문자로 바꾸고, 이미 소문자면 그대로 반환 (대표 문자는 항상 소문자로 표현)\ndef convert_small(alphabet):\n    for i in range(0, 26):\n        if big_letters[i] == alphabet:\n            return small_letters[i]\n    return alphabet\n\ndef solution(s):\n    answer = ''\n    s_len = len(s)\n    boss = convert_small(s[0])  # 현재 이어지고 있는 대표 문자(소문자 기준)\n    cnt = 1  # 대표 문자가 연속되는 개수\n    for i in range(1, s_len):\n        if convert_small(s[i]) == boss:\n            cnt += 1\n        else:\n            answer += boss\n            answer += str(cnt)\n            boss = convert_small(s[i])  # 새로운 문자로 대표 문자를 갱신해야 한다 (원래 버그였던 부분)\n            cnt = 1\n\n    answer += boss\n    answer += str(cnt)\n    return answer",

    "desc": "한 줄에 K자를 적을 수 있는 메모장에 영어 단어들을 적으려 합니다. 영어 단어는 정해진 순서로 적어야 하며, 단어와 단어 사이는 공백 하나로 구분합니다. 단, 한 줄의 끝에 단어 하나를 완전히 적지 못한다면, 그 줄의 나머지 부분을 모두 공백으로 채우고 다음 줄부터 다시 단어를 적습니다.\n\n예를 들어 한 줄에 10자를 적을 수 있고, 주어진 단어가 순서대로 [\"nice\", \"happy\", \"hello\", \"world\", \"hi\"] 인 경우 각 줄에 다음과 같이 적을 수 있습니다.('_'는 공백을 나타냅니다.)\n\n* 첫째 줄 : \"nice_happy\"\n* 둘째 줄 : \"hello_____\"\n* 셋째 줄 : \"world_hi\"\n\n이때, 둘째 줄에 \"hello\"를 적으면 단어를 적을 수 있는 남은 칸은 5칸이며, \"world\"를 이어서 적으려면 공백 하나를 포함하여 총 6칸이 필요합니다. 따라서 단어가 잘리게 되므로 남은 칸을 모두 공백으로 채운 후, 다음 줄에 \"world\"부터 다시 단어를 적어 나갑니다.\n\n한 줄에 적을 수 있는 글자 수 K와 적을 단어가 순서대로 담긴 리스트 words가 매개변수로 주어질 때, 단어를 모두 적으면 몇 줄이 되는지 return 하도록 solution 함수를 완성해주세요.\n\n▶ 매개변수 설명\n한 줄에 적을 수 있는 글자 수 K와 적을 단어가 순서대로 담긴 리스트 words가 solution 함수의 매개변수로 주어집니다.\n\n* K는 5 이상 30 이하인 자연수입니다.\n* words 리스트의 길이는 1 이상 100 이하입니다.\n* words 리스트에 담겨있는 모든 단어는 알파벳 소문자로만 이루어져 있으며, 각 단어의 길이는 K 이하입니다.\n\n▶ return 값 설명\n단어를 모두 적으면 몇 줄이 되는지 return해주세요.",

    "starter": "#다음과 같이 import를 사용할 수 있습니다.\n#import math\n\ndef solution(K, words):\n    #여기에 코드를 작성해주세요.\n    answer = 0\n    return answer\n\n#아래는 테스트케이스 출력을 해보기 위한 코드입니다.\nK = 10\nwords = [\"nice\", \"happy\", \"hello\", \"world\", \"hi\"]\nret = solution(10, words)\n\n#[실행] 버튼을 누르면 출력 값을 볼 수 있습니다.\nprint(\"solution 함수의 반환 값은\", ret, \"입니다.\")",
    "sol": "def solution(K, words):\n    answer = 1  # 최소 한 줄은 필요하다\n    cur = 0  # 현재 줄에 적은 글자 수\n    for w in words:\n        if cur == 0:  # 새 줄의 첫 단어라면 공백 없이 바로 적는다\n            cur = len(w)\n        elif cur + 1 + len(w) <= K:  # 공백 하나와 단어를 더 적을 공간이 있다면\n            cur = cur + 1 + len(w)\n        else:  # 공간이 부족하면 다음 줄로 넘어간다\n            answer += 1\n            cur = len(w)\n    return answer",

function fireConfetti(){const canvas=document.createElement("canvas");canvas.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999";canvas.width=window.innerWidth;canvas.height=window.innerHeight;document.body.appendChild(canvas);const ctx=canvas.getContext("2d");const colors=["#7c8cff","#3ddc97","#ffc76b","#ff7b8a","#5b6cf0","#ffffff"];const N=140;const particles=Array.from({length:N},()=>({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*0.3,r:4+Math.random()*5,c:colors[Math.floor(Math.random()*colors.length)],vx:(Math.random()-0.5)*4,vy:2+Math.random()*3,rot:Math.random()*360,vrot:(Math.random()-0.5)*12,shape:Math.random()<0.5?"rect":"circle"}));const start=performance.now();const duration=2600;function frame(now){const t=now-start;ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.rot+=p.vrot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-t/duration);if(p.shape==="rect")ctx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill()}ctx.restore()});if(t<duration)requestAnimationFrame(frame);else canvas.remove()}requestAnimationFrame(frame)}
